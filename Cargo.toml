[package]
name = "spe-sampler"
version = "0.1.0"
edition = "2021"

[dependencies]
constcat = "0.6.1"
ctrlc = { version = "3.4.7", features = ["termination"] }
lazy_static = "1.5.0"
libc = "0.2.172"
perf-event-open-sys = "5.0.0"
procfs = "0.17.0"
strum = { version = "0.27.1", features = ["derive", "strum_macros"] }
pagemap = "0.1.0"
image = "0.25.8"

[[bin]]
name="access_heatmap"
path = "src/access_heatmap.rs"

[[bin]]
name="tlb_sampler"
path = "src/tlb_sampler.rs"

[[bin]]
name="access_sampler"
path = "src/access_sampler.rs"

[[bin]]
name="access_bench"
path = "src/access_bench.rs"
